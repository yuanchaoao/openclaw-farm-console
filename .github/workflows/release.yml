name: Package and publish release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build complete source and installer archives
        run: python scripts/build_release.py
      - name: Publish installation archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("dist/release-manifest.json"))["version"])')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "This version is already released. Bump control.py VERSION before publishing another version."
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          Complete source and installers for macOS Apple silicon / Intel, Windows x64 and desktop Linux x64.

          Published at the owner's request without completing final native acceptance. These archives contain the latest fixes, but this release does not claim verified operation on every platform. See docs/validation.md for the actual earlier results and remaining verification. Native acceptance remains available as a separate, manually runnable workflow.

          Download the archive for your platform, extract it and follow README.md. SHA256SUMS covers the three platform installation archives. Supply your own Gateway credentials and relay server configuration.
          EOF
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "OpenClaw Farm Console $VERSION" --notes-file /tmp/release-notes.md
